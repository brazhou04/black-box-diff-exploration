[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-safety-training"
version = "0.1.0"
description = "Reproducible PEFT safety post-training experiment"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["safety_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a model and performs a training step"]
