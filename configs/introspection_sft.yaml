base_config: base.yaml

seed: 42

introspection:
  experiment_name: ia_qwen3_1_7b_v1
  organism_manifest: data/introspection/organisms.jsonl
  sft_dataset: data/introspection/sft.jsonl
  dpo_dataset: data/introspection/dpo.jsonl

  peft:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  organism_training:
    epochs: 2
    learning_rate: 0.0002
    weight_decay: 0.0
    batch_size: 1
    gradient_accumulation_steps: 16
    max_seq_length: 1024
    max_grad_norm: 1.0
    warmup_ratio: 0.03
    gradient_checkpointing: true
    logging_steps: 5
    max_steps: -1
    save_steps: 25
    save_total_limit: 2

  sft:
    epochs: 1
    learning_rate: 0.0001
    weight_decay: 0.0
    batch_size: 1
    organisms_per_step: 2
    max_seq_length: 512
    max_grad_norm: 1.0
    gradient_checkpointing: true
    max_steps: -1
    max_loaded_behavior_adapters: 8
    save_steps: 25
    save_total_limit: 2

  dpo:
    epochs: 1
    learning_rate: 0.00001
    weight_decay: 0.0
    batch_size: 1
    organisms_per_step: 2
    max_seq_length: 512
    max_grad_norm: 1.0
    beta: 0.1
    max_steps: -1
    max_loaded_behavior_adapters: 8
    save_steps: 25
    save_total_limit: 2
